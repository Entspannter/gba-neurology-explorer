name: Refresh Pages Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh data and rebuild Pages artifact
        run: gba-refresh --force

      - name: Validate generated data and Pages artifact
        run: gba-validate

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet --exit-code -- data docs site/data.js site/downloads; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push refreshed data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs site/data.js site/downloads
          git commit -m "chore: refresh scraped data"
          git push
